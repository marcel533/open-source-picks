<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software I trust — marcel533</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0F0F11">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --display:var(--sans);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --bg:#0F0F11; --card:#161618; --card-solid:#161618; --card-hover:#1B1B1E;
    --ink:#EDEDEF; --muted:#9A9AA3; --faint:#6E6E78;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
    --accent:#5FCB8A;
    --oss:#5FCB8A; --closed:#E2B04F; --risk:#F2766C;
    --dot-rgb:110,110,120; --hot-rgb:237,237,239;
    --glass:#0F0F11;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#FAFAFA; --card:#FFFFFF; --card-solid:#FFFFFF; --card-hover:#F4F4F5;
    --ink:#18181B; --muted:#5C5C66; --faint:#8A8A94;
    --line:rgba(0,0,0,.09); --line-2:rgba(0,0,0,.18);
    --accent:#17803F;
    --oss:#17803F; --closed:#946200; --risk:#B42318;
    --dot-rgb:150,150,160; --hot-rgb:24,24,27;
    --glass:#FAFAFA;
    color-scheme:light;
  }

  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; overflow-x:clip}
  html.lenis,html.lenis body{height:auto}
  .lenis.lenis-smooth{scroll-behavior:auto !important}
  .lenis.lenis-stopped{overflow:hidden}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:clip;
  }
  a{color:inherit}
  button{font:inherit; color:inherit}
  h1,h2,h3,p{margin:0}
  .wrap{position:relative; z-index:1; max-width:1160px; margin:0 auto; padding:0 20px}
  .is-hidden{display:none !important}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  :where(a,button,input):focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* page chrome */
  #progress{position:fixed; top:0; left:0; right:0; height:2px; z-index:60; transform:scaleX(0); transform-origin:0 50%;
            background:var(--accent)}
  body.pre .nav, body.pre .hero-copy, body.pre .tiltwrap{visibility:hidden}

  /* nav */
  .nav{
    position:fixed; z-index:50; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px; right:12px; max-width:1136px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 8px 8px 16px;
    background:var(--glass); border:1px solid var(--line); border-radius:12px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:-.02em}
  .brand svg{flex-shrink:0}
  .nav-links{display:none; gap:4px}
  .nav-links a{padding:6px 12px; border-radius:8px; color:var(--muted); text-decoration:none; font-size:.875rem; transition:color .15s, background .15s}
  .nav-links a:hover{color:var(--ink); background:var(--line)}
  .nav-actions{display:flex; align-items:center; gap:8px}

  .seg{position:relative; display:inline-flex; padding:3px; background:color-mix(in srgb,var(--ink) 5%,transparent); border:1px solid var(--line); border-radius:10px}
  .seg-thumb{position:absolute; top:3px; bottom:3px; left:0; width:0; border-radius:7px; background:var(--card-solid); border:1px solid var(--line-2); pointer-events:none}
  .seg button{position:relative; z-index:1; height:30px; padding:0 12px; border:0; background:transparent; color:var(--muted); font-size:.8125rem; cursor:pointer; transition:color .2s}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{color:var(--ink)}
  .seg.lang button{padding:0 10px; font-family:var(--mono); font-size:.75rem; font-weight:600}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--muted); cursor:pointer; transition:color .15s, border-color .15s}
  .icon-btn:hover{color:var(--ink); border-color:var(--line-2)}

  /* hero */
  .hero{position:relative; padding:96px 0 40px}
  .hero-grid{position:relative; z-index:1; display:grid; gap:44px; align-items:center}
  .prompt{display:inline-flex; align-items:center; gap:10px; margin-bottom:22px; padding:6px 12px; border:1px solid var(--line-2); border-radius:999px; font-family:var(--mono); font-size:.75rem; color:var(--muted); background:color-mix(in srgb,var(--card-solid) 70%,transparent)}
  .prompt i{width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .h1{font-family:var(--display); font-weight:600; font-size:clamp(2rem,4.4vw,3rem); line-height:1.08; letter-spacing:-.03em}
  .h1 .wd{display:inline-block; white-space:nowrap}
  .h1 .ch.scr{color:var(--accent); opacity:.9}
  .sub{margin-top:20px; max-width:52ch; color:var(--muted); font-size:1.0625rem; line-height:1.6}
  .sub .w{display:inline-block}
  .ctas{display:flex; flex-wrap:wrap; gap:8px; margin-top:28px}
  .mag{display:inline-block; padding:12px; margin:-12px}
  .btn{
    display:inline-flex; align-items:center; gap:10px; height:40px; padding:0 16px; border-radius:8px; border:1px solid var(--line-2);
    background:color-mix(in srgb,var(--card-solid) 80%,transparent); color:var(--ink); font-size:.9rem; font-weight:500; text-decoration:none; cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .btn:hover{border-color:var(--line-2); background:var(--card-hover)}
  .btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .btn.primary:hover{background:var(--ink); opacity:.88}
  .btn .cnt{font-family:var(--mono); font-size:.75rem; opacity:.7}
  .btn.sm{height:34px; padding:0 14px; font-size:.8125rem; border-radius:8px}

  /* terminal */
  .tiltwrap{perspective:1100px}
  .term{background:var(--card); border:1px solid var(--line-2); border-radius:12px; overflow:hidden; font-family:var(--mono); will-change:transform}
  .term-bar{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); font-size:.75rem; color:var(--muted)}
  .term-bar .dots{display:flex; gap:6px}
  .term-bar .dots i{width:9px; height:9px; border-radius:50%; background:var(--line-2)}
  .term-body{padding:16px 18px 18px; font-size:.8125rem; line-height:1.8}
  .cmd{overflow-wrap:anywhere; min-height:1.8em}
  .cmd::before{content:"$"; color:var(--accent); margin-right:.7em}
  .out{color:var(--muted)}
  .out::before{content:"\2713"; color:var(--accent); margin-right:.7em}
  .num{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  .ticks-wrap{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line-2)}
  .ticks{display:flex; gap:2px; height:44px; align-items:flex-end}
  .tick{flex:1 1 0; min-width:0; height:100%; padding:0; border:0; border-radius:2px; cursor:pointer; transform-origin:50% 100%; transition:filter .15s, transform .2s}
  .tick.o{background:var(--oss)} .tick.c{background:var(--closed)}
  .tick:hover,.tick:focus-visible{transform:scaleY(1.18); filter:brightness(1.25)}
  .tick-label{display:flex; justify-content:space-between; gap:12px; margin-top:12px; font-size:.75rem; color:var(--muted); min-height:1.4em}
  .tick-label b{color:var(--ink); font-weight:600}
  .legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px; font-size:.75rem; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .legend i{width:8px; height:8px; border-radius:2px}
  .legend .o i{background:var(--oss)} .legend .c i{background:var(--closed)}

  /* marquee */
  .marq{position:relative; z-index:1; overflow:hidden; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--bg) 55%,transparent)}
  .marq-track{display:flex; width:max-content; will-change:transform}
  .marq-set{display:flex}
  .marq-item{display:inline-flex; align-items:center; gap:10px; padding-right:36px; white-space:nowrap; color:var(--muted); font-size:.9375rem}

  /* partner */
  .partner{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 24px; margin-top:40px; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:12px}
  .partner-copy{display:flex; align-items:flex-start; gap:14px; min-width:0}
  .partner-copy p{font-size:.875rem; color:var(--muted)}
  .partner-copy strong{display:block; color:var(--ink); font-weight:600}
  .tag-ad{flex-shrink:0; margin-top:2px; padding:1px 9px; border:1px solid var(--line-2); border-radius:999px; font-family:var(--mono); font-size:.6875rem; color:var(--muted)}

  /* controls */
  .controls{z-index:20; margin-top:28px; padding:0}
  .controls-box{padding:14px; background:var(--glass); border:1px solid var(--line); border-radius:12px}
  .controls-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .search-wrap{position:relative; flex:1 1 260px; min-width:0}
  .search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none}
  .search{width:100%; height:42px; padding:0 44px 0 40px; background:color-mix(in srgb,var(--ink) 4%,transparent); color:var(--ink); border:1px solid var(--line); border-radius:8px; font:inherit; font-size:.9375rem}
  .search::placeholder{color:var(--muted)}
  .search:hover{border-color:var(--line-2)}
  .kbd{position:absolute; right:12px; top:50%; transform:translateY(-50%); padding:0 7px; border:1px solid var(--line-2); border-radius:6px; font-family:var(--mono); font-size:.7rem; line-height:1.6; color:var(--muted); pointer-events:none}
  @media (hover:none){.kbd{display:none}}
  .pills{display:flex; gap:6px; margin-top:12px; overflow-x:auto; scrollbar-width:none; padding-right:28px;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex-shrink:0; height:32px; padding:0 14px; background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:999px; font-size:.8125rem; cursor:pointer; white-space:nowrap; transition:background .2s,color .2s,border-color .2s}
  .pill:hover{color:var(--ink); border-color:var(--line-2)}
  .pill[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .count{margin-top:12px; font-family:var(--mono); font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums}

  /* sections */
  .section{position:relative; z-index:1; padding-top:64px}
  .section-head{margin-bottom:22px}
  .section-head h2{display:flex; align-items:baseline; flex-wrap:wrap; gap:12px; font-family:var(--display); font-weight:600; font-size:1.375rem; letter-spacing:-.02em; line-height:1.2}
  .sec-count{font-family:var(--mono); font-size:.8125rem; font-weight:500; letter-spacing:0; padding:2px 10px; border:1px solid var(--line-2); border-radius:999px; color:var(--muted); font-variant-numeric:tabular-nums}
  .section-head p{margin-top:10px; max-width:62ch; color:var(--muted)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}

  .card{
    position:relative; display:flex; flex-direction:column; gap:12px; padding:16px;
    background:var(--card); border:1px solid var(--line); border-radius:10px; transition:background .15s, border-color .15s;
  }
  .card:hover{background:var(--card-hover); border-color:var(--line-2)}
  .card.is-closed{border-style:dashed}
  .card:has(.c-link:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
  .card.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,60%{border-color:var(--accent)}100%{border-color:var(--line)}}
  .c-head{display:flex; align-items:center; gap:12px}
  /* real logos: brand marks sit on their brand colour, app icons are shown as shipped */
  .logo{flex-shrink:0; display:grid; place-items:center; width:40px; height:40px; border-radius:9px; overflow:hidden; border:1px solid var(--line); background:var(--b); color:var(--f)}
  .logo svg{width:22px; height:22px}
  .logo img{width:100%; height:100%; display:block}
  .logo.none{background:var(--card-hover); color:var(--muted); font-weight:600; font-size:1rem}
  .c-title{min-width:0; flex:1}
  .c-name{font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:-.01em; line-height:1.25; overflow-wrap:anywhere}
  .c-cat{display:block; font-size:.8125rem; color:var(--muted)}
  .c-desc{color:var(--muted); font-size:.875rem; line-height:1.55}
  .badge{flex-shrink:0; align-self:flex-start; display:inline-flex; align-items:center; gap:6px; padding:2px 10px; white-space:nowrap; border-radius:999px; font-size:.6875rem; font-family:var(--mono);
    border:1px solid color-mix(in srgb,currentColor 32%,transparent); background:color-mix(in srgb,currentColor 11%,transparent)}
  .badge .bd{width:6px; height:6px; border-radius:50%; background:currentColor}
  .badge.oss{color:var(--oss)} .badge.closed{color:var(--closed)}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tag{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border:1px solid var(--line-2); border-radius:999px; font-size:.75rem; color:var(--muted)}
  .tag.risk{color:var(--risk); border-color:color-mix(in srgb,var(--risk) 38%,transparent); background:color-mix(in srgb,var(--risk) 10%,transparent)}
  .c-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:12px; border-top:1px dashed var(--line)}
  .host{font-family:var(--mono); font-size:.75rem; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .go{display:grid; place-items:center; width:26px; height:26px; color:var(--faint); transition:color .15s}
  .card:hover .go{color:var(--ink)}
  .c-link{position:static}
  .c-link::after{content:""; position:absolute; inset:0; z-index:2}
  .c-link:focus-visible{outline:none}

  .empty{padding:64px 0; display:flex; flex-direction:column; align-items:flex-start; gap:16px; color:var(--muted)}

  /* footer */
  footer{position:relative; z-index:1; margin-top:72px; padding:24px 0 40px; border-top:1px solid var(--line); overflow:hidden}
  .foot-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; color:var(--muted); font-size:.875rem}
  .logo-note{margin-top:10px; font-size:.75rem; color:var(--faint); max-width:70ch}

  @media (min-width:720px){
    .nav-links{display:flex}
    .controls{position:sticky; top:calc(env(safe-area-inset-top,0px) + 76px)}
  }
  @media (min-width:960px){
    .hero{padding:128px 0 56px}
    .hero-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:56px}
  }
  @media (max-width:719px){
    .hero{padding-top:96px}
    .sub{font-size:1.0625rem}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important; animation:none !important; scroll-behavior:auto !important}
  }
</style>
</head>

<div id="progress" aria-hidden="true"></div>

<nav class="nav" id="nav">
  <div class="brand">
    <svg width="26" height="26" viewBox="24 4 208 248" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M190 38.6 216 48V120C216 176 176 216 128 240 80 216 40 176 40 120V48L128 16" stroke="var(--ink)" stroke-width="18"/><path d="M92 100 128 128 92 156M142 158H178" stroke="var(--accent)" stroke-width="18"/></svg>

<script>
/* ---------- i18n + data ---------- */
const I18N = {
  de: {

const ICON_WARN = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 1.5 13.5h13L8 2Z"/><path d="M8 6.5v3M8 11.8v.01"/></svg>`;

/* ---------- state + helpers ---------- */
let lang = 'en';
try{ lang = localStorage.getItem('lang') || 'en'; }catch(e){}
if(!I18N[lang]) lang = 'en';
const state = { search:'', oss:'all', bucket:'all' };
const $ = id => document.getElementById(id);
const T = () => I18N[lang];
const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const hasGsap = !!window.gsap;
const motion = () => hasGsap && !reduce();
const rnd = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
if(hasGsap){ gsap.registerPlugin(...[window.Flip, window.ScrollTrigger].filter(Boolean)); }
let lenis = null;
let revealsArmed = false, revealTriggers = [];

/* =========================================================
   Text effects
   ========================================================= */
/* DecryptedText: characters resolve left to right out of random glyphs */
function buildHeadline(text){
  const el = $('heroH1');
  el.setAttribute('aria-label', text);
  el.innerHTML = '<span aria-hidden="true">' +
    text.split(' ').map(w => `<span class="wd">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`).join(' ') + '</span>';
}
function decryptHeadline(duration = 1.4){
  const chars = [...document.querySelectorAll('#heroH1 .ch')], words = [...document.querySelectorAll('#heroH1 .wd')];
  const finals = chars.map(c => c.textContent);
  words.forEach(w => { w.style.width = w.getBoundingClientRect().width + 'px'; });  // lock layout while glyphs change
  const p = { v:0 }; let f = 0;
  return gsap.to(p, {
    v:chars.length, duration, ease:'power1.inOut',
    onUpdate(){
      if((f++ % 2) && p.v < chars.length) return;
      const n = Math.floor(p.v);
      chars.forEach((c, i) => {
        if(i < n){ if(c.dataset.s !== '0'){ c.textContent = finals[i]; c.classList.remove('scr'); c.dataset.s = '0'; } }
        else { c.textContent = rnd(); c.classList.add('scr'); c.dataset.s = '1'; }
      });
    },
    onComplete(){ chars.forEach((c, i) => { c.textContent = finals[i]; c.classList.remove('scr'); }); words.forEach(w => { w.style.width = ''; }); }
  });
}
/* BlurText: words resolve out of a blur */
function setSub(text){
  $('heroSub').innerHTML = text.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
}

/* =========================================================
   Rendering
   ========================================================= */
function badge(app){
  return app.o ? `<span class="badge oss"><span class="bd"></span>${T().badgeOss}</span>`
               : `<span class="badge closed"><span class="bd"></span>${T().badgeClosed}</span>`;
}
function tags(app){
  const list = lang === 'en' ? (app.ex || app.x) : app.x;
  const risk = lang === 'en' ? (app.erisk || app.risk) : app.risk;
  const chips = (list || []).map(tg => `<span class="tag">${tg}</span>`).join('');
  const riskChip = risk ? `<span class="tag risk">${ICON_WARN}${risk}</span>` : '';
  return (chips || riskChip) ? `<div class="tags">${chips}${riskChip}</div>` : '';
}

/* Brand marks sit on their brand color, app icons are shown as shipped, neutral initial as fallback. */
function logoTile(app){
  const k = APP_LOGO[app.t], L = k && LOGOS[k];
  if(L && L.t === 'svg') return `<span class="logo" style="--b:${L.bg};--f:${L.fg}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${L.p}"/></svg></span>`;
  if(L && L.t === 'img') return `<span class="logo" aria-hidden="true"><img src="${L.src}" alt="" width="40" height="40" loading="lazy" decoding="async"></span>`;
  return `<span class="logo none" aria-hidden="true">${app.t.trim()[0].toUpperCase()}</span>`;
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./, ''); }catch(e){ return ''; } }
function card(app, i){
  const desc = lang === 'en' ? app.ed : app.d;
  return `<article class="card ${app.o ? '' : 'is-closed'}" id="app-${i}" data-flip-id="${i}" data-bucket="${app.b}" data-oss="${app.o}">
    <div class="c-head">
      ${logoTile(app)}
      <div class="c-title"><h3 class="c-name">${app.t}</h3><span class="c-cat">${CATS[app.c][lang]}</span></div>
      ${badge(app)}
    </div>
    <p class="c-desc">${desc}</p>
    ${tags(app)}
    <div class="c-foot"><span class="host">${hostOf(app.u)}</span><span class="go" aria-hidden="true">${ICON_EXT}</span></div>
    <a class="c-link" href="${app.u}" target="_blank" rel="noopener noreferrer" aria-label="${app.t} ${T().newTab}"></a>
  </article>`;
}
function renderGrids(){
  const idx = APPS.map((a, i) => [a, i]);
  $('ossGrid').innerHTML = idx.filter(([a]) => a.o).map(([a, i]) => card(a, i)).join('');
  $('closedGrid').innerHTML = idx.filter(([a]) => !a.o).map(([a, i]) => card(a, i)).join('');
}
function renderPills(){
  $('pills').innerHTML = `<button type="button" class="pill" data-bucket="all" aria-pressed="${state.bucket === 'all'}">${T().allCats}</button>` +
    Object.entries(BUCKETS).map(([k, v]) => `<button type="button" class="pill" data-bucket="${k}" aria-pressed="${state.bucket === k}">${v[lang]}</button>`).join('');
}
function renderTicks(){
  $('ticks').innerHTML = APPS.map((a, i) =>
    `<button type="button" class="tick ${a.o ? 'o' : 'c'}" data-i="${i}" aria-label="${a.t}, ${a.o ? T().badgeOss : T().badgeClosed}"></button>`).join('');
  $('ticks').setAttribute('aria-label', T().tickHint);
  setTickLabel(null);
}
function setTickLabel(i){
  const el = $('tickLabel');
  if(i == null){ el.textContent = T().tickHint; return; }
  const a = APPS[i];
  el.innerHTML = `<b>${a.t}</b> &nbsp;${a.o ? T().badgeOss : T().badgeClosed}`;
}
function renderMarquee(){
  const set = APPS.map(a => `<span class="marq-item">${logoTile(a)}${a.t}</span>`).join('');
  $('marqTrack').innerHTML = `<div class="marq-set">${set}</div><div class="marq-set">${set}</div>`;
}

function applyStaticTexts(){
  const t = T(), ossN = APPS.filter(a => a.o).length;
  document.documentElement.lang = lang;
  document.title = t.title;
  $('promptText').textContent = t.chip;
  $('termCmd').textContent = t.termCmd;
  $('out1').innerHTML = t.term1(APPS.length);
  $('out2').innerHTML = t.term2(ossN, APPS.length - ossN);
  $('out3').innerHTML = t.term3;
  buildHeadline(t.heroH1);
  setSub(t.heroSub);
  $('navOss').textContent = t.fOss; $('navClosed').textContent = t.fClosed;
  $('ctaOss').innerHTML = `${t.fOss} <span class="cnt">${ossN}</span>`;
  $('ctaClosed').innerHTML = `${t.fClosed} <span class="cnt">${APPS.length - ossN}</span>`;
  $('lgO').textContent = `${t.badgeOss} (${ossN})`;
  $('lgC').textContent = `${t.badgeClosed} (${APPS.length - ossN})`;
  $('partnerTag').textContent = t.partnerTag;
  $('partnerDesc').textContent = t.partnerDesc;
  $('partnerBtn').textContent = t.partnerBtn;
  $('search').placeholder = t.searchPh;
  $('search').setAttribute('aria-label', t.searchLabel);
  $('licenseSeg').setAttribute('aria-label', t.licenseLabel);
  $('pills').setAttribute('aria-label', t.catLabel);
  $('langSeg').setAttribute('aria-label', t.langLabel);
  $('themeBtn').setAttribute('aria-label', t.themeLabel); $('themeBtn').title = t.themeLabel;
  $('fAll').textContent = t.fAll; $('fOss').textContent = t.fOss; $('fClosed').textContent = t.fClosed;
  $('ossHead').textContent = t.ossHead; $('ossSub').textContent = t.ossSub;
  $('closedHead').textContent = t.closedHead; $('closedSub').textContent = t.closedSub;
  $('emptyText').textContent = t.empty; $('resetBtn').textContent = t.reset;
  $('footerText').textContent = t.footer; $('topBtn').textContent = t.topBtn; $('logoNote').textContent = t.logoNote;
  $('langEn').setAttribute('aria-pressed', String(lang === 'en'));
  $('langDe').setAttribute('aria-pressed', String(lang === 'de'));
}

/* sliding thumb behind segmented controls */
function moveThumb(seg, animate){
  const btn = seg.querySelector('button[aria-pressed="true"]'), thumb = seg.querySelector('.seg-thumb');
  if(!btn || !thumb) return;
  const x = btn.offsetLeft, w = btn.offsetWidth;
  if(motion() && animate) gsap.to(thumb, { x, width:w, duration:.4, ease:'power3.out' });
  else if(hasGsap) gsap.set(thumb, { x, width:w });
  else { thumb.style.left = x + 'px'; thumb.style.width = w + 'px'; }
}
const thumbs = animate => { moveThumb($('langSeg'), animate); moveThumb($('licenseSeg'), animate); };

/* =========================================================
   Filtering: Flip glides the remaining cards into place
   ========================================================= */
function disarmReveals(){
  if(!revealsArmed) return;
  revealTriggers.forEach(t => t.kill()); revealTriggers = []; revealsArmed = false;
  if(hasGsap) gsap.set('.card', { clearProps:'opacity,transform,filter' });
}
function applyFilters(animate){
  disarmReveals();
  const cards = [...document.querySelectorAll('.card')];
  const useFlip = animate && motion() && window.Flip;
  let before;
  if(useFlip){ Flip.killFlipsOf(cards); before = Flip.getState(cards); }
  let visible = 0;
  cards.forEach(c => {
    const okS = !state.search || c.textContent.toLowerCase().includes(state.search);
    const okO = state.oss === 'all' || (state.oss === 'oss' ? c.dataset.oss === 'true' : c.dataset.oss === 'false');
    const okB = state.bucket === 'all' || c.dataset.bucket === state.bucket;
    const show = okS && okO && okB;
    c.classList.toggle('is-hidden', !show);
    if(show) visible++;
  });
  [['oss','ossGrid','ossCount'], ['closed','closedGrid','closedCount']].forEach(([sid, gid, cid]) => {
    const n = [...$(gid).children].filter(c => !c.classList.contains('is-hidden')).length;
    $(sid).classList.toggle('is-hidden', n === 0);
    $(cid).textContent = n;
  });
  $('resultCount').textContent = T().shown(visible, APPS.length);
  $('emptyState').classList.toggle('is-hidden', visible !== 0);
  if(useFlip){
    Flip.from(before, { duration:.45, ease:'power3.out',
      onEnter: els => gsap.fromTo(els, { opacity:0, scale:.96 }, { opacity:1, scale:1, duration:.4, clearProps:'opacity,transform' }),
      onComplete(){ if(window.ScrollTrigger) ScrollTrigger.refresh(); } });
  }
}

function renderAll(){
  disarmReveals();
  applyStaticTexts();
  renderPills(); renderTicks(); renderGrids(); renderMarquee();
  applyFilters(false);
  thumbs(false);
}

/* =========================================================
   Motion: intro, tilt, magnet, marquee, scroll
   ========================================================= */
function intro(){
  if(!motion()){ document.body.classList.remove('pre'); return; }
  document.body.classList.remove('pre');
  const tl = gsap.timeline({ defaults:{ ease:'power3.out' } });
  tl.from('#nav', { y:-30, opacity:0, duration:.7 }, 0)
    .from('.prompt', { opacity:0, y:10, duration:.5 }, .05)
    .add(decryptHeadline(1.4), .15)
    .from('#heroSub .w', { opacity:0, filter:'blur(10px)', y:10, duration:.6, stagger:.03, clearProps:'filter,opacity,transform' }, .85)
    .from('.ctas .mag', { opacity:0, y:14, duration:.6, stagger:.1, clearProps:'opacity,transform' }, 1.5)
    .from('#tiltwrap', { opacity:0, y:36, duration:.9, clearProps:'opacity,transform' }, .35);

  /* terminal: type the command, then count the results up */
  const cmdEl = $('termCmd'), full = cmdEl.textContent, p = { n:0 };
  cmdEl.textContent = '';
  tl.to(p, { n:full.length, duration:.9, ease:'none',
    onUpdate(){ cmdEl.textContent = full.slice(0, Math.round(p.n)); },
    onComplete(){ cmdEl.textContent = full; } }, .8);
  tl.from('.term .out', { opacity:0, y:5, duration:.35, stagger:.18, clearProps:'opacity,transform' }, 1.7);
  document.querySelectorAll('.term .num').forEach((el, i) => {
    const target = +el.dataset.n, q = { v:0 };
    el.textContent = '0';
    tl.to(q, { v:target, duration:.9, ease:'power1.out',
      onUpdate(){ el.textContent = Math.round(q.v); }, onComplete(){ el.textContent = target; } }, 1.7 + i * .18);
  });
  tl.from('.tick', { scaleY:0, duration:.55, stagger:{ each:.02 }, ease:'back.out(2.2)', clearProps:'transform' }, 2.1)
    .from('.tick-label, .legend', { opacity:0, duration:.5, clearProps:'opacity' }, 2.8);
}

/* Tilt, magnet, marquee and scroll run inside gsap.matchMedia(): they revert when reduced motion is switched on. */
function initTilt(){
  const wrap = $('tiltwrap'), term = $('term');
  const rx = gsap.quickTo(term, 'rotationX', { duration:.6, ease:'power3' });
  const ry = gsap.quickTo(term, 'rotationY', { duration:.6, ease:'power3' });
  gsap.set(term, { transformPerspective:1100 });
  const move = e => {
    const r = wrap.getBoundingClientRect();
    ry(((e.clientX - r.left) / r.width - .5) * 9);
    rx(-((e.clientY - r.top) / r.height - .5) * 9);
  };
  const leave = () => { rx(0); ry(0); };
  wrap.addEventListener('pointermove', move);
  wrap.addEventListener('pointerleave', leave);
  return () => {
    wrap.removeEventListener('pointermove', move);
    wrap.removeEventListener('pointerleave', leave);
    gsap.set(term, { clearProps:'transform' });
  };
}

/* The wrapper carries padding, so the pull starts before the pointer touches the button. */
function initMagnets(){
  const undo = [];
  document.querySelectorAll('.mag').forEach(w => {
    const b = w.firstElementChild;
    const xTo = gsap.quickTo(b, 'x', { duration:.5, ease:'power3' }), yTo = gsap.quickTo(b, 'y', { duration:.5, ease:'power3' });
    const move = e => {
      const r = b.getBoundingClientRect();
      xTo((e.clientX - (r.left + r.width / 2)) * .35); yTo((e.clientY - (r.top + r.height / 2)) * .35);
    };
    const leave = () => { xTo(0); yTo(0); };
    w.addEventListener('pointermove', move);
    w.addEventListener('pointerleave', leave);
    undo.push(() => { w.removeEventListener('pointermove', move); w.removeEventListener('pointerleave', leave); gsap.set(b, { clearProps:'transform' }); });
  });
  return () => undo.forEach(fn => fn());
}

/* Drifts on its own; scroll speed and direction steer it. */
function initMarquee(){
  const track = $('marqTrack');
  let x = 0, dir = -1, skew = 0, lastY = window.scrollY, setW = 0;
  const measure = () => { setW = track.firstElementChild.getBoundingClientRect().width; };
  const tick = (time, dt) => {
    if(!setW) return;
    const s = dt / 1000, y = window.scrollY, vel = s ? (y - lastY) / s : 0; lastY = y;
    if(Math.abs(vel) > 8) dir = vel > 0 ? -1 : 1;
    x += dir * (60 + Math.min(Math.abs(vel) * .4, 1400)) * s;
    if(x <= -setW) x += setW;
    if(x > 0) x -= setW;
    skew += (Math.max(-9, Math.min(9, -vel * .004)) - skew) * .12;
    track.style.transform = `translate3d(${x}px,0,0) skewX(${skew}deg)`;
  };
  measure();
  window.addEventListener('resize', measure);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  gsap.ticker.add(tick);
  return () => { gsap.ticker.remove(tick); window.removeEventListener('resize', measure); track.style.transform = ''; };
}

/* Lenis rides on the GSAP ticker; the progress bar is scrubbed by ScrollTrigger. */
function initScroll(){
  let tick;
  if(window.Lenis){
    lenis = new Lenis({ lerp:.1 });
    lenis.on('scroll', ScrollTrigger.update);
    tick = t => lenis.raf(t * 1000);
    gsap.ticker.add(tick);
    gsap.ticker.lagSmoothing(0);
  }
  gsap.to('#progress', { scaleX:1, ease:'none', scrollTrigger:{ start:0, end:'max', scrub:.3 } });
  const refresh = setTimeout(() => ScrollTrigger.refresh(), 600);
  return () => {
    clearTimeout(refresh);
    if(lenis){ gsap.ticker.remove(tick); lenis.destroy(); lenis = null; gsap.ticker.lagSmoothing(500, 33); }
  };
}

function scrollToEl(target, extra = 0){
  const el = typeof target === 'string' ? document.querySelector(target) : target;
  if(!el) return;
  /* clear the fixed nav and the sticky filter bar, measured rather than guessed */
  const stuck = window.innerWidth >= 720 ? $('controls').offsetHeight + 76 : 76;
  const offset = -(stuck + 16 + extra);
  if(lenis) lenis.scrollTo(el, { offset, duration:1.2 });
  else window.scrollTo({ top:el.getBoundingClientRect().top + window.scrollY + offset, behavior: reduce() ? 'auto' : 'smooth' });
}

/* =========================================================
   Events
   ========================================================= */
$('search').addEventListener('input', e => { state.search = e.target.value.toLowerCase().trim(); applyFilters(true); });
$('search').addEventListener('keydown', e => {
  if(e.key === 'Escape' && e.target.value){ e.target.value = ''; state.search = ''; applyFilters(true); }
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $('search').focus();
  }
});
$('licenseSeg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn) return;
  $('licenseSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  state.oss = btn.dataset.oss; moveThumb($('licenseSeg'), true); applyFilters(true);
});
$('pills').addEventListener('click', e => {
  const btn = e.target.closest('.pill'); if(!btn) return;
  $('pills').querySelectorAll('.pill').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  state.bucket = btn.dataset.bucket; applyFilters(true);
});
function resetFilters(){
  state.search = ''; state.oss = 'all'; state.bucket = 'all'; $('search').value = '';
  $('licenseSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.oss === 'all')));
  $('pills').querySelectorAll('.pill').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bucket === 'all')));
  moveThumb($('licenseSeg'), true);
}
$('resetBtn').addEventListener('click', () => { resetFilters(); applyFilters(true); });

$('langSeg').addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  try{ localStorage.setItem('lang', lang); }catch(err){}
  renderAll(); moveThumb($('langSeg'), false);
  if(motion()){ decryptHeadline(.9); gsap.from('#heroSub .w', { opacity:0, filter:'blur(8px)', duration:.5, stagger:.015, clearProps:'filter,opacity' }); }
});

/* tick bar: hover shows the tool, click jumps to its card */
$('ticks').addEventListener('pointerover', e => { const t = e.target.closest('.tick'); if(t) setTickLabel(+t.dataset.i); });
$('ticks').addEventListener('focusin', e => { const t = e.target.closest('.tick'); if(t) setTickLabel(+t.dataset.i); });
$('ticks').addEventListener('pointerleave', () => setTickLabel(null));
$('ticks').addEventListener('click', e => {
  const t = e.target.closest('.tick'); if(!t) return;
  let c = $('app-' + t.dataset.i);
  if(c.classList.contains('is-hidden')){ resetFilters(); applyFilters(false); c = $('app-' + t.dataset.i); }
  scrollToEl(c);
  c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
});

document.addEventListener('click', e => {
  const a = e.target.closest('[data-jump]'); if(!a) return;
  e.preventDefault(); scrollToEl(a.dataset.jump);
});
$('topBtn').addEventListener('click', () => { if(lenis) lenis.scrollTo(0, { duration:1.4 }); else window.scrollTo({ top:0, behavior: reduce() ? 'auto' : 'smooth' }); });

function setTheme(mode){
  if(mode) document.documentElement.setAttribute('data-theme', mode); else document.documentElement.removeAttribute('data-theme');
  try{ localStorage.setItem('theme', mode || ''); }catch(e){}
}
try{ const saved = localStorage.getItem('theme'); if(saved) document.documentElement.setAttribute('data-theme', saved); }catch(e){}
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme((cur ? cur === 'dark' : true) ? 'light' : 'dark');
});
window.addEventListener('resize', () => thumbs(false));

/* =========================================================
   Boot
   ========================================================= */
renderAll();
const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1100))]) : Promise.resolve();
fontsReady.then(() => { thumbs(false); intro(); });
if(hasGsap){
  gsap.matchMedia().add({ motion:'(prefers-reduced-motion: no-preference)', fine:'(hover:hover) and (pointer:fine)' }, ctx => {
    const { motion, fine } = ctx.conditions;
    if(!motion) return;
    const undo = [initMarquee()];
    if(window.ScrollTrigger) undo.push(initScroll());
    if(fine) undo.push(initTilt(), initMagnets());
    return () => undo.forEach(fn => fn());
  });
}
setTimeout(() => document.body.classList.remove('pre'), 3000);   /* failsafe */
</script>
</body>
</html>
